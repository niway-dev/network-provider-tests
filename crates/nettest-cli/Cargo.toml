[package]
name = "nettest-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command line front end for nettest"

[[bin]]
name = "nettest"
path = "src/main.rs"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
clap = { version = "4.6.7", features = ["derive"] }
nettest-core.workspace = true
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "signal", "time"] }
